name: Fetch screenshots
on:
  push:
    paths:
      - ".github/workflows/fetch-screenshots.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots
        run: |
          set -euo pipefail
          curl -fsSL -o mobile_search_spacing_empty_focused_overlay.png https://litter.catbox.moe/syv1o3.png
          curl -fsSL -o mobile_search_spacing_typed_with_clear_x.png https://litter.catbox.moe/wbkwca.png
          curl -fsSL -o mobile_search_spacing_cleared_still_in_overlay.png https://litter.catbox.moe/wrj92d.png
          curl -fsSL -o mobile_search_spacing_back_dismissed_to_find.png https://litter.catbox.moe/jnb3nd.png
          curl -fsSL -o mobile_search_spacing_empty_focused_field_crop.png https://litter.catbox.moe/0asj9k.png
          curl -fsSL -o mobile_search_spacing_typed_field_crop.png https://litter.catbox.moe/ljzfbe.png
          curl -fsSL -o mobile_search_spacing_find_bar_field_crop.png https://litter.catbox.moe/tnq87n.png
          file *.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -m "Add overlay spacing screenshots for PR 1780" || true
          git push || true
          gh release delete screenshots-spacing --yes || true
          gh release create screenshots-spacing \
            mobile_search_spacing_empty_focused_overlay.png \
            mobile_search_spacing_typed_with_clear_x.png \
            mobile_search_spacing_cleared_still_in_overlay.png \
            mobile_search_spacing_back_dismissed_to_find.png \
            mobile_search_spacing_empty_focused_field_crop.png \
            mobile_search_spacing_typed_field_crop.png \
            mobile_search_spacing_find_bar_field_crop.png \
            --title "PR 1780 overlay spacing screenshots" \
            --notes "Public mobile-viewport screenshots for wags-hq/wags#1780 overlay search bar spacing. Safe to delete after review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
