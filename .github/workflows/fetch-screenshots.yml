name: Fetch screenshots
on:
  push:
    paths:
      - ".github/workflows/fetch-screenshots.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots
        run: |
          set -euo pipefail
          curl -fsSL -o mobile_search_empty_focused_overlay.png https://litter.catbox.moe/6jdya2.png
          curl -fsSL -o mobile_search_typed_with_clear_x.png https://litter.catbox.moe/ox6mb5.png
          curl -fsSL -o mobile_search_cleared_still_in_overlay.png https://litter.catbox.moe/71fh8e.png
          curl -fsSL -o mobile_search_back_dismissed_to_find.png https://litter.catbox.moe/q4skwt.png
          file *.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -m "Add PR 1780 mobile search screenshots" || true
          git push || true
          gh release delete screenshots --yes || true
          gh release create screenshots \
            mobile_search_empty_focused_overlay.png \
            mobile_search_typed_with_clear_x.png \
            mobile_search_cleared_still_in_overlay.png \
            mobile_search_back_dismissed_to_find.png \
            --title "PR 1780 mobile search screenshots" \
            --notes "Public screenshots for wags-hq/wags#1780. Safe to delete after review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
